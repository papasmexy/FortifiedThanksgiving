# Room competitions: no Microsoft SSO or external identity credentials.
# Review docs/HOSTING.md for paid costs and first-admin setup.
services:
  - type: web
    name: fortified-thanksgiving
    runtime: node
    plan: starter
    region: ohio
    repo: https://github.com/papasmexy/FortifiedThanksgiving
    branch: main
    autoDeployTrigger: 'off'
    buildCommand: npm ci --no-fund && npm test
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: contest-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_ENCRYPTION_KEY
        generateValue: true
      - key: ADMIN_SETUP_TOKEN
        generateValue: true
      - key: BASE_URL
        sync: false
